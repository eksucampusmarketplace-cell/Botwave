<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trivia Quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#fff);padding:1rem}
h1{font-size:1.5rem;margin-bottom:.5rem}
#stats{margin-bottom:1rem;font-size:.9rem;opacity:.8}
#question{font-size:1.2rem;text-align:center;margin:1rem 0;max-width:90vw}
.options{display:flex;flex-direction:column;gap:10px;width:min(90vw,340px)}
.opt{padding:1rem;border:2px solid transparent;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#16213e);color:var(--tg-theme-text-color,#fff);font-size:1rem;cursor:pointer;text-align:left;transition:all .2s}
.opt:active{opacity:.7}
.opt.correct{background:#4ecca3!important;border-color:#4ecca3}
.opt.wrong{background:#e94560!important;border-color:#e94560}
#feedback{margin:1rem 0;font-size:1rem;min-height:1.5rem;text-align:center}
</style>
</head>
<body>
<h1>🧠 Trivia Quiz</h1>
<div id="stats">Score: 0/0</div>
<div id="question"></div>
<div class="options" id="options"></div>
<div id="feedback"></div>
<script>
const questions=[
{q:"What planet is known as the Red Planet?",a:"Mars",o:["Venus","Mars","Jupiter","Saturn"]},
{q:"What is the largest ocean on Earth?",a:"Pacific Ocean",o:["Atlantic Ocean","Indian Ocean","Pacific Ocean","Arctic Ocean"]},
{q:"Who painted the Mona Lisa?",a:"Leonardo da Vinci",o:["Michelangelo","Leonardo da Vinci","Raphael","Donatello"]},
{q:"What is the chemical symbol for gold?",a:"Au",o:["Ag","Au","Fe","Cu"]},
{q:"What year did the Titanic sink?",a:"1912",o:["1905","1912","1920","1898"]},
{q:"What is the smallest country in the world?",a:"Vatican City",o:["Monaco","Vatican City","San Marino","Liechtenstein"]},
{q:"How many bones are in the human body?",a:"206",o:["186","196","206","216"]},
{q:"What is the speed of light in km/s?",a:"300,000 km/s",o:["150,000 km/s","300,000 km/s","450,000 km/s","600,000 km/s"]},
{q:"Which element has the atomic number 1?",a:"Hydrogen",o:["Helium","Hydrogen","Oxygen","Carbon"]},
{q:"What is the capital of Australia?",a:"Canberra",o:["Sydney","Melbourne","Canberra","Perth"]},
{q:"Who wrote Romeo and Juliet?",a:"Shakespeare",o:["Dickens","Shakespeare","Austen","Hemingway"]},
{q:"What is the largest mammal?",a:"Blue Whale",o:["African Elephant","Blue Whale","Giraffe","Hippopotamus"]},
{q:"In what year did World War II end?",a:"1945",o:["1943","1944","1945","1946"]},
{q:"What language has the most native speakers?",a:"Mandarin Chinese",o:["English","Spanish","Mandarin Chinese","Hindi"]},
{q:"What is the hardest natural substance?",a:"Diamond",o:["Quartz","Diamond","Sapphire","Ruby"]},
];
let idx=0,score=0,total=0,locked=false;
const shuffled=[...questions].sort(()=>Math.random()-.5);

function show(){
  if(idx>=shuffled.length){idx=0;}
  locked=false;
  const q=shuffled[idx];
  document.getElementById('question').textContent=q.q;
  document.getElementById('feedback').textContent='';
  const opts=document.getElementById('options');
  opts.innerHTML='';
  const shuffledOpts=[...q.o].sort(()=>Math.random()-.5);
  shuffledOpts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt';btn.textContent=o;
    btn.onclick=()=>check(o,btn,q.a);
    opts.appendChild(btn);
  });
}

function check(chosen,btn,answer){
  if(locked)return;locked=true;total++;
  if(chosen===answer){
    btn.classList.add('correct');score++;
    document.getElementById('feedback').textContent='✅ Correct!';
  }else{
    btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===answer)b.classList.add('correct');});
    document.getElementById('feedback').textContent='❌ The answer was: '+answer;
  }
  document.getElementById('stats').textContent=`Score: ${score}/${total}`;
  idx++;
  setTimeout(show,1500);
}
show();
</script>
</body>
</html>
