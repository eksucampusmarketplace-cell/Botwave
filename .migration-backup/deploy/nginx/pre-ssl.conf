# Pre-SSL config — used before Let's Encrypt certificates are obtained.
# Run: docker compose up -d nginx
# Then: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d botwave.online -d www.botwave.online -d evo.botwave.online --email your@email.com --agree-tos --no-eff-email
# Then replace this file with default.conf and restart nginx.

server {
    listen 80;
    server_name botwave.online www.botwave.online evo.botwave.online;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to BotWave while waiting for SSL
    location / {
        proxy_pass http://botwave-web:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
