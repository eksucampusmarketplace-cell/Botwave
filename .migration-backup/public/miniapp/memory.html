<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#fff)}
h1{font-size:1.5rem;margin-bottom:.5rem}
#stats{margin-bottom:1rem;font-size:.9rem;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(85vw,320px)}
.card{aspect-ratio:1;background:var(--tg-theme-button-color,#e94560);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:transform .3s;transform-style:preserve-3d}
.card.flipped,.card.matched{background:var(--tg-theme-secondary-bg-color,#16213e);transform:rotateY(180deg)}
.card.matched{opacity:.6}
button{padding:.8rem 2rem;border:none;border-radius:8px;background:var(--tg-theme-button-color,#e94560);color:var(--tg-theme-button-text-color,#fff);font-size:1rem;cursor:pointer;margin-top:1rem}
</style>
</head>
<body>
<h1>🃏 Memory Game</h1>
<div id="stats">Moves: 0 | Pairs: 0/8</div>
<div class="grid" id="grid"></div>
<button onclick="init()">New Game</button>
<script>
const emojis=['🐶','🐱','🐼','🦊','🐸','🦁','🐵','🦄'];
let cards=[],flipped=[],matched=0,moves=0,locked=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function init(){
  cards=shuffle([...emojis,...emojis]);
  flipped=[];matched=0;moves=0;locked=false;
  updateStats();
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  cards.forEach((emoji,i)=>{
    const d=document.createElement('div');
    d.className='card';
    d.dataset.idx=i;
    d.textContent='';
    d.onclick=()=>flip(i,d);
    grid.appendChild(d);
  });
}

function flip(i,el){
  if(locked||flipped.length>=2||el.classList.contains('flipped')||el.classList.contains('matched'))return;
  el.classList.add('flipped');
  el.textContent=cards[i];
  flipped.push({idx:i,el});
  if(flipped.length===2){
    moves++;
    updateStats();
    locked=true;
    if(cards[flipped[0].idx]===cards[flipped[1].idx]){
      flipped.forEach(f=>f.el.classList.add('matched'));
      matched++;
      updateStats();
      flipped=[];locked=false;
      if(matched===8)setTimeout(()=>alert('You win! 🎉 '+moves+' moves'),300);
    }else{
      setTimeout(()=>{
        flipped.forEach(f=>{f.el.classList.remove('flipped');f.el.textContent='';});
        flipped=[];locked=false;
      },800);
    }
  }
}

function updateStats(){document.getElementById('stats').textContent=`Moves: ${moves} | Pairs: ${matched}/8`;}
init();
</script>
</body>
</html>
