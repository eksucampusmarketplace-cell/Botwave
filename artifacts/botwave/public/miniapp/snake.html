<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#fff);touch-action:none}
h1{font-size:1.5rem;margin-bottom:.5rem}
#score{margin-bottom:.5rem;font-size:1rem}
canvas{border-radius:12px;background:#16213e}
.controls{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:4px;margin-top:1rem}
.controls button{border:none;border-radius:8px;background:var(--tg-theme-button-color,#e94560);color:#fff;font-size:1.5rem;cursor:pointer}
.controls button:active{opacity:.7}
#restart{padding:.6rem 1.5rem;border:none;border-radius:8px;background:var(--tg-theme-button-color,#e94560);color:#fff;font-size:1rem;cursor:pointer;margin-top:.5rem}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div id="score">Score: 0</div>
<canvas id="c" width="300" height="300"></canvas>
<div class="controls">
<div></div><button ontouchstart="setDir(0,-1)" onclick="setDir(0,-1)">⬆️</button><div></div>
<button ontouchstart="setDir(-1,0)" onclick="setDir(-1,0)">⬅️</button><button ontouchstart="setDir(0,1)" onclick="setDir(0,1)">⬇️</button><button ontouchstart="setDir(1,0)" onclick="setDir(1,0)">➡️</button>
</div>
<button id="restart" onclick="init()">Restart</button>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const G=15,S=canvas.width/G;
let snake,food,dir,score,interval,gameOver;

function init(){
  clearInterval(interval);
  snake=[{x:7,y:7}];dir={x:1,y:0};score=0;gameOver=false;
  placeFood();
  document.getElementById('score').textContent='Score: 0';
  interval=setInterval(tick,150);
}

function placeFood(){
  do{food={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)};}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function setDir(x,y){if(dir.x!==-x||dir.y!==-y){dir={x,y};}}

function tick(){
  if(gameOver)return;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=G||head.y<0||head.y>=G||snake.some(s=>s.x===head.x&&s.y===head.y)){
    gameOver=true;clearInterval(interval);draw();return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score++;document.getElementById('score').textContent='Score: '+score;placeFood();}
  else snake.pop();
  draw();
}

function draw(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#e94560';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/3,0,Math.PI*2);ctx.fill();
  snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#4ecca3':'#36a88a';ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2);});
  if(gameOver){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('Game Over!',150,140);ctx.font='18px sans-serif';ctx.fillText('Score: '+score,150,170);}
}

document.addEventListener('keydown',e=>{
  const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if(map[e.key])setDir(...map[e.key]);
});
init();
</script>
</body>
</html>
