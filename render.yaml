# BotWave Render Blueprint
# Single free-tier Web Service running both Next.js + WhatsApp bot.
#
# Usage: Render Dashboard → New → Blueprint → connect this repo
# Or manually update your existing service's Build/Start commands.

services:
  - type: web
    name: botwave
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run build:bot && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o node_modules/.bin/yt-dlp && chmod +x node_modules/.bin/yt-dlp
    startCommand: bash scripts/start-all.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOT_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
