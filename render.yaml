services:
  - type: web
    name: botwave-web
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOT_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
  - type: worker
    name: botwave-bot
    env: node
    region: oregon
    buildCommand: npm install && npm run build:bot
    startCommand: npm run start:bot
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOT_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
