# ========================================================
# BotWave + Evolution API — Full Stack Docker Compose
# Deploy on Contabo VPS (Ubuntu + Docker)
# ========================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-botwave-build: &botwave-build
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: ${REDIS_URL}

services:
  # ── Evolution API ──────────────────────────────────────
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      evolution-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - botwave-net
    env_file:
      - .env.evolution
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Evolution Postgres ─────────────────────────────────
  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASS:-evolution_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - botwave-net
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis (shared: Evolution + BotWave bot) ────────────
  redis:
    container_name: botwave_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - botwave-net
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── BotWave Web (Next.js + Socket.io game server) ─────
  botwave-web:
    container_name: botwave_web
    <<: *botwave-build
    restart: unless-stopped
    ports:
      - "3000:10000"
    env_file:
      - .env.botwave
    environment:
      - PORT=10000
      - NODE_ENV=production
      - SELF_URL=http://botwave-web:10000
      - IS_WORKER=false
      - EVOLUTION_API_URL=http://evolution-api:8080
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
    volumes:
      - /opt/botwave:/opt/botwave
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "dist/bot/server/customServer.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── BotWave Bot (Main orchestrator) ────────────────────
  botwave-bot:
    container_name: botwave_bot_main
    <<: *botwave-build
    restart: unless-stopped
    env_file:
      - .env.botwave
    environment:
      - NODE_ENV=production
      - IS_WORKER=false
      - SELF_URL=http://botwave-bot:10000
      - WORKER_URLS=http://botwave-worker-1:10000,http://botwave-worker-2:10000,http://botwave-worker-3:10000
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - WEBHOOK_BASE_URL=http://botwave-web:10000
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
    command: ["node", "dist/bot/bot/index.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── BotWave Worker 1 ───────────────────────────────────
  botwave-worker-1:
    container_name: botwave_worker_1
    <<: *botwave-build
    restart: unless-stopped
    env_file:
      - .env.botwave
    environment:
      - NODE_ENV=production
      - IS_WORKER=true
      - SELF_URL=http://botwave-worker-1:10000
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - WEBHOOK_BASE_URL=http://botwave-web:10000
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
    command: ["node", "dist/bot/bot/index.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── BotWave Worker 2 ───────────────────────────────────
  botwave-worker-2:
    container_name: botwave_worker_2
    <<: *botwave-build
    restart: unless-stopped
    env_file:
      - .env.botwave
    environment:
      - NODE_ENV=production
      - IS_WORKER=true
      - SELF_URL=http://botwave-worker-2:10000
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - WEBHOOK_BASE_URL=http://botwave-web:10000
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
    command: ["node", "dist/bot/bot/index.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── BotWave Worker 3 ───────────────────────────────────
  botwave-worker-3:
    container_name: botwave_worker_3
    <<: *botwave-build
    restart: unless-stopped
    env_file:
      - .env.botwave
    environment:
      - NODE_ENV=production
      - IS_WORKER=true
      - SELF_URL=http://botwave-worker-3:10000
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - WEBHOOK_BASE_URL=http://botwave-web:10000
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
    command: ["node", "dist/bot/bot/index.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nginx (Reverse Proxy + HTTPS) ───────────────────────
  # NOTE: Disabled by default — Caddy is handling reverse proxy + HTTPS.
  # Uncomment if you want to use Nginx instead of Caddy.
  # nginx:
  #   container_name: botwave_nginx
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
  #     - certbot_www:/var/www/certbot:ro
  #     - certbot_certs:/etc/letsencrypt:ro
  #   networks:
  #     - botwave-net
  #   depends_on:
  #     - botwave-web
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #       reservations:
  #         memory: 64M
  #   logging: *default-logging
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:80/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

  # ── Certbot (Let's Encrypt auto-renewal) ───────────────
  # NOTE: Disabled — Caddy handles SSL certificates automatically.
  # certbot:
  #   container_name: botwave_certbot
  #   image: certbot/certbot
  #   restart: unless-stopped
  #   volumes:
  #     - certbot_www:/var/www/certbot
  #     - certbot_certs:/etc/letsencrypt
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #   logging: *default-logging

  # ── Portainer (Web UI for Docker management) ───────────
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - botwave-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  portainer_data:
  # certbot_www:
  # certbot_certs:

networks:
  botwave-net:
    name: botwave-net
    driver: bridge
