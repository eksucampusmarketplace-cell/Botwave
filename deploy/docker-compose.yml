# ========================================================
# BotWave + Evolution API — Full Stack Docker Compose
# Deploy on Contabo VPS (Ubuntu + Docker)
# ========================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-botwave-build: &botwave-build
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REDIS_URL: ${REDIS_URL}

services:
  # ── Evolution API ──────────────────────────────────────
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      evolution-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - botwave-net
    env_file:
      - .env.evolution
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Evolution Postgres ─────────────────────────────────
  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASS:-evolution_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - botwave-net
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Redis (shared: Evolution + BotWave bot) ────────────
  redis:
    container_name: botwave_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - botwave-net
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── BotWave Web (Next.js + Socket.io game server) ─────
  botwave-web:
    container_name: botwave_web
    <<: *botwave-build
    restart: unless-stopped
    ports:
      - "3000:10000"
    env_file:
      - .env.botwave
    environment:
      - PORT=10000
      - NODE_ENV=production
      - SELF_URL=http://botwave-web:10000
      - IS_WORKER=false
      - EVOLUTION_API_URL=http://evolution-api:8080
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
    volumes:
      - /opt/botwave:/opt/botwave
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["node", "dist/bot/server/customServer.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── BotWave Telegram Bot (isolated) ───────────────────
  botwave-telegram:
    container_name: botwave_telegram
    <<: *botwave-build
    restart: unless-stopped
    env_file:
      - .env.botwave
    environment:
      - NODE_ENV=production
      - BOT_PLATFORM=telegram
      - IS_WORKER=false
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
    command: ["node", "dist/bot/bot/telegram-entrypoint.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      update_config:
        order: start-first
        failure_action: rollback
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "try { const http = require('http'); const r = http.get('http://localhost:10000/health', res => { process.exit(res.statusCode === 200 ? 0 : 1); }); r.on('error', () => process.exit(1)); r.setTimeout(5000, () => process.exit(1)); } catch(e) { process.exit(1); }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── BotWave WhatsApp Bot (isolated) ──────────────────
  botwave-whatsapp:
    container_name: botwave_whatsapp
    <<: *botwave-build
    restart: unless-stopped
    env_file:
      - .env.botwave
    environment:
      - NODE_ENV=production
      - BOT_PLATFORM=whatsapp
      - IS_WORKER=false
      - SELF_URL=http://botwave-whatsapp:10000
      - WORKER_URLS=
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://evolution-api:8080
      - WEBHOOK_BASE_URL=http://botwave-web:10000
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
      - MAX_WORKER_THREADS=${MAX_WORKER_THREADS:-40}
      - SCALE_THRESHOLD=${SCALE_THRESHOLD:-25}
    command: ["node", "dist/bot/bot/whatsapp-entrypoint.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      update_config:
        order: start-first
        failure_action: rollback
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "try { const http = require('http'); const r = http.get('http://localhost:10000/health', res => { process.exit(res.statusCode === 200 ? 0 : 1); }); r.on('error', () => process.exit(1)); r.setTimeout(5000, () => process.exit(1)); } catch(e) { process.exit(1); }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── BotWave Telegram Userbot (isolated) ──────────────
  botwave-userbot:
    container_name: botwave_userbot
    <<: *botwave-build
    restart: unless-stopped
    env_file:
      - .env.botwave
    environment:
      - NODE_ENV=production
      - BOT_PLATFORM=telegram_userbot
      - IS_WORKER=false
      - REDIS_URL=redis://redis:6379
      - USERBOT_HEALTH_PORT=10002
      - INTERNAL_SECRET=${INTERNAL_SECRET:-botwave-internal-docker-secret}
      - USERBOT_PROXY_LIST=${USERBOT_PROXY_LIST:-}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
    command: ["node", "dist/bot/bot/userbot/entrypoint.js"]
    networks:
      - botwave-net
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      update_config:
        order: start-first
        failure_action: rollback
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "try { const http = require('http'); const r = http.get('http://localhost:10002/health', res => { process.exit(res.statusCode === 200 ? 0 : 1); }); r.on('error', () => process.exit(1)); r.setTimeout(5000, () => process.exit(1)); } catch(e) { process.exit(1); }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # NOTE: The old single botwave-bot container has been replaced by
  # botwave-telegram + botwave-whatsapp + botwave-userbot for fault isolation.
  # Each platform runs independently — if one crashes, the others keep running.
  # All share the same Docker image, just with different CMD entrypoints.

  # ── BotWave Postgres (Supabase data) ────────────────────
  botwave-postgres:
    container_name: botwave_postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: botwave
      POSTGRES_USER: botwave
      POSTGRES_PASSWORD: ${BOTWAVE_DB_PASS:-botwave_local_db_2024}
    volumes:
      - botwave_pgdata:/var/lib/postgresql/data
    networks:
      - botwave-net
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botwave"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── GoTrue (Supabase Auth) ────────────────────────────
  botwave-gotrue:
    container_name: botwave_gotrue
    image: supabase/gotrue:v2.151.0
    restart: unless-stopped
    depends_on:
      botwave-postgres:
        condition: service_healthy
    environment:
      GOTRUE_LOG_LEVEL: warn
      GOTRUE_DB_DATABASE_URL: postgres://botwave:${BOTWAVE_DB_PASS:-botwave_local_db_2024}@botwave-postgres:5432/botwave?search_path=auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_MIGRATIONS_PATH: /usr/local/etc/auth/migrations
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_URI_ALLOW_LIST: "*"
      API_EXTERNAL_URL: http://144.91.107.59:8000
      GOTRUE_SITE_URL: https://botwave.online
    networks:
      botwave-net:
        aliases:
          - gotrue
    expose:
      - "9999"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Kong (Supabase API Gateway) ───────────────────────
  botwave-kong:
    container_name: botwave_kong
    image: kong:3.5
    restart: unless-stopped
    depends_on:
      botwave-gotrue:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_WORKER_PROCESSES: "1"
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
    networks:
      botwave-net:
        aliases:
          - supabase-kong
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── PostgREST (Supabase REST API) ─────────────────────
  botwave-postgrest:
    container_name: botwave_postgrest
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      botwave-postgres:
        condition: service_healthy
    environment:
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_URI: postgres://botwave:${BOTWAVE_DB_PASS:-botwave_local_db_2024}@botwave-postgres:5432/botwave
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    networks:
      botwave-net:
        aliases:
          - postgrest
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging
    # PostgREST v12+ uses a distroless image (no /bin/sh, no wget).
    # Healthcheck disabled — Kong upstream checks handle availability.
    healthcheck:
      test: ["NONE"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Nginx (Reverse Proxy + HTTPS) ───────────────────────
  # NOTE: Disabled by default — Caddy is handling reverse proxy + HTTPS.
  # Uncomment if you want to use Nginx instead of Caddy.
  # nginx:
  #   container_name: botwave_nginx
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
  #     - certbot_www:/var/www/certbot:ro
  #     - certbot_certs:/etc/letsencrypt:ro
  #   networks:
  #     - botwave-net
  #   depends_on:
  #     - botwave-web
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #       reservations:
  #         memory: 64M
  #   logging: *default-logging
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:80/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

  # ── Certbot (Let's Encrypt auto-renewal) ───────────────
  # NOTE: Disabled — Caddy handles SSL certificates automatically.
  # certbot:
  #   container_name: botwave_certbot
  #   image: certbot/certbot
  #   restart: unless-stopped
  #   volumes:
  #     - certbot_www:/var/www/certbot
  #     - certbot_certs:/etc/letsencrypt
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #   logging: *default-logging

  # ── Portainer (Web UI for Docker management) ───────────
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - botwave-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging: *default-logging

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  portainer_data:
  botwave_pgdata:
  # certbot_www:
  # certbot_certs:

networks:
  botwave-net:
    name: botwave-net
    driver: bridge
