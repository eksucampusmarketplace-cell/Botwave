name: Build & Deploy to VPS

on:
  push:
    branches: [BotWave]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to force-build (web,whatsapp,telegram,userbot). Empty = changed-only.'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/botwave

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # changes: figure out which services actually need to rebuild on this push.
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.decide.outputs.web }}
      whatsapp: ${{ steps.decide.outputs.whatsapp }}
      telegram: ${{ steps.decide.outputs.telegram }}
      userbot: ${{ steps.decide.outputs.userbot }}
      any: ${{ steps.decide.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Each filter answers "does this service need a rebuild?".
          # `shared` is anything every service depends on (deps, base image,
          # workflow, lib utilities the bots pull in).
          filters: |
            shared:
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile'
              - 'deploy/docker-compose.yml'
              - '.github/workflows/deploy.yml'
              - 'scripts/patch-baileys.js'
              - 'tsconfig.bot.json'
              - 'lib/**'
              - 'bot/database.ts'
              - 'bot/env.ts'
              - 'bot/index.ts'
              - 'bot/BotManager.ts'
              - 'bot/sessionRouter.ts'
              - 'bot/infrastructure/**'
              - 'bot/scaling/**'
            web:
              - 'app/**'
              - 'components/**'
              - 'public/**'
              - 'server/**'
              - 'next.config.js'
              - 'next.config.mjs'
              - 'tailwind.config.ts'
              - 'postcss.config.js'
              - 'tsconfig.json'
            whatsapp:
              - 'bot/whatsapp/**'
              - 'bot/whatsapp-entrypoint.ts'
            telegram:
              - 'bot/telegram/**'
              - 'bot/telegram-entrypoint.ts'
            userbot:
              - 'bot/userbot/**'

      - id: decide
        # Combine paths-filter output with the manual workflow_dispatch input
        # so an operator can force a rebuild of any subset of services.
        env:
          MANUAL: ${{ github.event.inputs.services }}
          F_SHARED: ${{ steps.filter.outputs.shared }}
          F_WEB: ${{ steps.filter.outputs.web }}
          F_WHATSAPP: ${{ steps.filter.outputs.whatsapp }}
          F_TELEGRAM: ${{ steps.filter.outputs.telegram }}
          F_USERBOT: ${{ steps.filter.outputs.userbot }}
        run: |
          set -eu

          want() {
            local svc="$1"
            local changed="$2"
            # Force-build if listed in manual dispatch input.
            if [[ ",${MANUAL}," == *",${svc},"* ]]; then
              echo "true"; return
            fi
            # Shared file changed → every service rebuilds.
            if [[ "${F_SHARED}" == "true" ]]; then
              echo "true"; return
            fi
            # Otherwise: only if its own paths changed.
            echo "${changed}"
          }

          WEB=$(want web "${F_WEB}")
          WHATSAPP=$(want whatsapp "${F_WHATSAPP}")
          TELEGRAM=$(want telegram "${F_TELEGRAM}")
          USERBOT=$(want userbot "${F_USERBOT}")

          ANY=false
          for v in "$WEB" "$WHATSAPP" "$TELEGRAM" "$USERBOT"; do
            if [[ "$v" == "true" ]]; then ANY=true; fi
          done

          {
            echo "web=${WEB}"
            echo "whatsapp=${WHATSAPP}"
            echo "telegram=${TELEGRAM}"
            echo "userbot=${USERBOT}"
            echo "any=${ANY}"
          } | tee -a "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # build: one job per changed service. Runs in parallel.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, whatsapp, telegram, userbot]
    steps:
      - name: Skip if service unchanged
        id: gate
        env:
          WEB: ${{ needs.changes.outputs.web }}
          WHATSAPP: ${{ needs.changes.outputs.whatsapp }}
          TELEGRAM: ${{ needs.changes.outputs.telegram }}
          USERBOT: ${{ needs.changes.outputs.userbot }}
          SERVICE: ${{ matrix.service }}
        run: |
          case "$SERVICE" in
            web)      v="$WEB" ;;
            whatsapp) v="$WHATSAPP" ;;
            telegram) v="$TELEGRAM" ;;
            userbot)  v="$USERBOT" ;;
            *)        v=false ;;
          esac
          echo "build=${v}" >> "$GITHUB_OUTPUT"
          if [[ "$v" != "true" ]]; then
            echo "::notice::Service $SERVICE is unchanged, skipping build."
          fi

      - name: Checkout
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}

  # ───────────────────────────────────────────────────────────────────────────
  # deploy: SSH to VPS and `docker compose up -d` only the changed services.
  # Compose is idempotent — if the image digest didn't change, the container
  # is not restarted.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [changes, build]
    if: needs.changes.outputs.any == 'true' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Compute service list
        id: svc
        env:
          WEB: ${{ needs.changes.outputs.web }}
          WHATSAPP: ${{ needs.changes.outputs.whatsapp }}
          TELEGRAM: ${{ needs.changes.outputs.telegram }}
          USERBOT: ${{ needs.changes.outputs.userbot }}
        run: |
          SERVICES=""
          [[ "$WEB" == "true" ]]      && SERVICES="$SERVICES botwave-web"
          [[ "$WHATSAPP" == "true" ]] && SERVICES="$SERVICES botwave-whatsapp"
          [[ "$TELEGRAM" == "true" ]] && SERVICES="$SERVICES botwave-telegram"
          [[ "$USERBOT" == "true" ]]  && SERVICES="$SERVICES botwave-userbot"
          SERVICES="$(echo "$SERVICES" | xargs)"
          echo "list=${SERVICES}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICES_TO_DEPLOY: ${{ steps.svc.outputs.list }}
          COMMIT_SHA: ${{ github.sha }}
          # Optional: GHCR credentials so the VPS can pull private images.
          # If the GHCR packages are public these can be left empty.
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          envs: SERVICES_TO_DEPLOY,COMMIT_SHA,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            echo "=== BotWave per-service deploy ==="
            echo "Commit:   ${COMMIT_SHA}"
            echo "Services: ${SERVICES_TO_DEPLOY}"
            START=$(date +%s)

            cd /opt/botwave

            # 1. Sync compose file + env updates from BotWave branch.
            echo "[1/4] Syncing repo..."
            git fetch origin BotWave
            git reset --hard origin/BotWave

            cd deploy

            # 2. Authenticate to GHCR if credentials are present. Skipped
            #    silently otherwise — pull will still succeed for public
            #    packages.
            if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USERNAME:-}" ]; then
              echo "[2/4] Logging in to GHCR..."
              echo "${GHCR_TOKEN}" | docker login ghcr.io \
                -u "${GHCR_USERNAME}" --password-stdin
            else
              echo "[2/4] GHCR credentials not set — relying on public access."
            fi

            # 3. Pull only the images we're redeploying. `docker compose pull`
            #    skips already-current images by digest, so this is cheap to
            #    re-run.
            echo "[3/4] Pulling fresh images..."
            # shellcheck disable=SC2086
            docker compose pull ${SERVICES_TO_DEPLOY} 2>&1 | tail -20

            # 4. Restart only the services whose image changed. Compose is
            #    idempotent — containers whose image digest is unchanged stay
            #    running.
            echo "[4/4] Restarting services..."
            # shellcheck disable=SC2086
            docker compose up -d --no-deps ${SERVICES_TO_DEPLOY} 2>&1

            echo ""
            echo "Container state:"
            docker ps --format "table {{.Names}}\t{{.Status}}" | sort

            END=$(date +%s)
            echo ""
            echo "=== Deploy complete in $((END - START))s ==="

            # Tidy up dangling images.
            docker image prune -f 2>&1 | tail -3
