name: Build & Deploy to VPS

on:
  push:
    branches: [BotWave]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/botwave

jobs:
  build-and-push:
    name: Build Image & Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 4m
          script: |
            set -e
            echo "=== BotWave Fast Deploy ==="
            echo "Commit: ${{ github.sha }}"
            START=$(date +%s)

            # 1. Pull pre-built image from GHCR (only changed layers)
            echo "[1/4] Pulling pre-built image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest 2>&1 | tail -5

            # 2. Tag it for compose
            docker tag ghcr.io/${{ env.IMAGE_NAME }}:latest deploy-botwave-web:latest

            # 3. Pull latest code (for compose file + env updates)
            echo "[2/4] Syncing deploy config..."
            cd /opt/botwave
            git fetch origin BotWave
            git reset --hard origin/BotWave

            # 4. Restart only app services (infra stays untouched)
            echo "[3/4] Restarting app services..."
            cd deploy
            docker compose up -d --no-deps botwave-web botwave-whatsapp botwave-telegram botwave-userbot 2>&1

            # 5. Wait for health + report
            echo "[4/4] Waiting for health..."
            sleep 10
            docker ps --format "table {{.Names}}\t{{.Status}}" | sort

            END=$(date +%s)
            echo ""
            echo "=== Deploy complete in $((END - START))s ==="

            # Cleanup old images
            docker image prune -f 2>&1 | tail -3
