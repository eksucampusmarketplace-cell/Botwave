<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Challenge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#fff)}
h1{font-size:1.5rem;margin-bottom:.5rem}
#stats{margin-bottom:1rem;font-size:.9rem;opacity:.8}
#problem{font-size:2.5rem;margin:1rem 0}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(80vw,280px)}
.opt{padding:1rem;border:none;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#16213e);color:var(--tg-theme-text-color,#fff);font-size:1.3rem;cursor:pointer;transition:background .2s}
.opt:active{opacity:.7}
.opt.correct{background:#4ecca3!important}
.opt.wrong{background:#e94560!important}
#feedback{margin:1rem 0;font-size:1.2rem;min-height:1.5rem}
</style>
</head>
<body>
<h1>🔢 Math Challenge</h1>
<div id="stats">Score: 0 | Streak: 0</div>
<div id="problem"></div>
<div class="options" id="options"></div>
<div id="feedback"></div>
<script>
let score=0,streak=0,answer,locked=false;
const ops=['+','-','×'];

function generate(){
  locked=false;
  document.getElementById('feedback').textContent='';
  const op=ops[Math.floor(Math.random()*ops.length)];
  let a,b;
  if(op==='×'){a=Math.floor(Math.random()*12)+1;b=Math.floor(Math.random()*12)+1;}
  else{a=Math.floor(Math.random()*50)+10;b=Math.floor(Math.random()*30)+1;}
  if(op==='-'&&b>a)[a,b]=[b,a];
  answer=op==='+'?a+b:op==='-'?a-b:a*b;
  document.getElementById('problem').textContent=`${a} ${op} ${b} = ?`;
  const choices=new Set([answer]);
  while(choices.size<4){
    const offset=Math.floor(Math.random()*10)-5;
    if(offset!==0)choices.add(answer+offset);
  }
  const arr=[...choices].sort(()=>Math.random()-.5);
  const optDiv=document.getElementById('options');
  optDiv.innerHTML='';
  arr.forEach(v=>{
    const btn=document.createElement('button');
    btn.className='opt';btn.textContent=v;
    btn.onclick=()=>check(v,btn);
    optDiv.appendChild(btn);
  });
}

function check(v,btn){
  if(locked)return;locked=true;
  if(v===answer){
    btn.classList.add('correct');score++;streak++;
    document.getElementById('feedback').textContent='✅ Correct!';
  }else{
    btn.classList.add('wrong');streak=0;
    document.querySelectorAll('.opt').forEach(b=>{if(parseInt(b.textContent)===answer)b.classList.add('correct');});
    document.getElementById('feedback').textContent='❌ Wrong!';
  }
  document.getElementById('stats').textContent=`Score: ${score} | Streak: ${streak}`;
  setTimeout(generate,1200);
}
generate();
</script>
</body>
</html>
