<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--tg-theme-bg-color,#1a1a2e);color:var(--tg-theme-text-color,#fff)}
h1{font-size:1.5rem;margin-bottom:1rem}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,300px);aspect-ratio:1}
.cell{background:var(--tg-theme-secondary-bg-color,#16213e);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;cursor:pointer;transition:transform .1s}
.cell:active{transform:scale(.95)}
.cell.x{color:#e94560}.cell.o{color:#0f3460}
#status{margin:1rem 0;font-size:1.1rem;min-height:1.5rem}
button{padding:.8rem 2rem;border:none;border-radius:8px;background:var(--tg-theme-button-color,#e94560);color:var(--tg-theme-button-text-color,#fff);font-size:1rem;cursor:pointer;margin-top:.5rem}
</style>
</head>
<body>
<h1>❌⭕ Tic Tac Toe</h1>
<div id="status">Your turn (X)</div>
<div class="board" id="board"></div>
<button onclick="reset()">New Game</button>
<script>
const board=document.getElementById('board');
const status=document.getElementById('status');
let cells=Array(9).fill('');
let current='X';
let gameOver=false;
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function render(){
  board.innerHTML='';
  cells.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='cell'+(v==='X'?' x':v==='O'?' o':'');
    d.textContent=v;
    d.onclick=()=>play(i);
    board.appendChild(d);
  });
}

function check(){
  for(const[a,b,c]of wins){
    if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c])return cells[a];
  }
  return cells.includes('')?null:'draw';
}

function play(i){
  if(cells[i]||gameOver||current!=='X')return;
  cells[i]='X';
  const r=check();
  if(r){endGame(r);render();return;}
  current='O';
  status.textContent="Bot thinking...";
  render();
  setTimeout(botMove,400);
}

function botMove(){
  // Simple AI: win>block>center>corner>random
  let move=-1;
  for(const[a,b,c]of wins){
    const line=[cells[a],cells[b],cells[c]];
    if(line.filter(x=>x==='O').length===2&&line.includes('')){move=[a,b,c][line.indexOf('')];break;}
  }
  if(move===-1)for(const[a,b,c]of wins){
    const line=[cells[a],cells[b],cells[c]];
    if(line.filter(x=>x==='X').length===2&&line.includes('')){move=[a,b,c][line.indexOf('')];break;}
  }
  if(move===-1&&!cells[4])move=4;
  if(move===-1){const corners=[0,2,6,8].filter(i=>!cells[i]);if(corners.length)move=corners[Math.floor(Math.random()*corners.length)];}
  if(move===-1)move=cells.findIndex(c=>!c);
  if(move===-1)return;
  cells[move]='O';
  const r=check();
  if(r){endGame(r);render();return;}
  current='X';
  status.textContent="Your turn (X)";
  render();
}

function endGame(r){
  gameOver=true;
  if(r==='draw')status.textContent="It's a draw!";
  else status.textContent=r==='X'?"You win! 🎉":"Bot wins! 🤖";
}

function reset(){cells=Array(9).fill('');current='X';gameOver=false;status.textContent="Your turn (X)";render();}
render();
</script>
</body>
</html>
